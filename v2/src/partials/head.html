<!DOCTYPE html>
<html lang="fr" data-base="{{base}}"{{htmlattrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{siteUrl}}/{{canon}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#0c2a8a">
<meta property="og:type" content="{{ogType}}">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="USM Tennis Montargis">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{siteUrl}}/{{canon}}">
<meta property="og:image" content="{{siteUrl}}/assets/img/club/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{base}}favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="{{base}}assets/img/brand/icon-192.png">
<link rel="apple-touch-icon" href="{{base}}assets/img/brand/icon-180.png">
<link rel="manifest" href="{{base}}manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="{{base}}assets/css/site.css">
<script>try{var t=localStorage.getItem('usm_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
{{preload}}
{{jsonld}}
</head>
<body class="{{bodyClass}}">
