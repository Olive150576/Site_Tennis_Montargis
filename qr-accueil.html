<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>USM Tennis Montargis</title>
    <style>
        body {
            margin: 0;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .logo {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <img src="/logo_usm_new.png" alt="USM" class="logo"
             style="width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,215,0,0.4);">
        <div id="status" style="margin-top:16px;font-size:13px;color:#64748b;">Chargement...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        var statusEl = document.getElementById('status');
        function setStatus(msg, color) { statusEl.textContent = msg; statusEl.style.color = color || '#64748b'; }

        firebase.initializeApp({
            apiKey: "AIzaSyA4GdfEh3M6mEszwRFif049qsmoLq4tn7c",
            authDomain: "usm-tennis.firebaseapp.com",
            databaseURL: "https://usm-tennis-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "usm-tennis",
            storageBucket: "usm-tennis.firebasestorage.app",
            messagingSenderId: "631286589550",
            appId: "1:631286589550:web:7e68afcddfbb8e16d79e7f"
        });

        var db = firebase.database();
        var today = new Date().toISOString().slice(0, 10);
        var redirected = false;

        function redirect() {
            if (!redirected) {
                redirected = true;
                window.location.replace('/');
            }
        }

        setStatus('Connexion Firebase...');
        var update = {};
        update['total'] = firebase.database.ServerValue.increment(1);
        update['par_jour/' + today] = firebase.database.ServerValue.increment(1);

        db.ref('qr_scans/accueil').update(update)
            .then(function() {
                setStatus('✓ Scan enregistré', '#22c55e');
                setTimeout(redirect, 800);
            })
            .catch(function(err) {
                setStatus('Erreur : ' + err.code + ' — ' + err.message, '#ef4444');
                setTimeout(redirect, 4000);
            });

        setTimeout(redirect, 5000);
    </script>
</body>
</html>
