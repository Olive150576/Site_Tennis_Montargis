<html lang="fr">
<head>

    <style>
        body {
            margin: 0;
            background: linear-gradient(160deg, #1541c9, #0c2a8a 60%, #081d63);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .logo {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
    </style>
</head>
<body>
    <img src="/assets/img/brand/logo-usm.webp" alt="USM Tennis Montargis" class="logo" width="120" height="92">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyA4GdfEh3M6mEszwRFif049qsmoLq4tn7c",
            authDomain: "usm-tennis.firebaseapp.com",
            databaseURL: "https://usm-tennis-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "usm-tennis",
            storageBucket: "usm-tennis.firebasestorage.app",
            messagingSenderId: "631286589550",
            appId: "1:631286589550:web:7e68afcddfbb8e16d79e7f"
        });

        var db = firebase.database();
        var today = new Date().toISOString().slice(0, 10);
        var redirected = false;

        function redirect() {
            if (!redirected) { redirected = true; window.location.replace('/'); }
        }

        var update = {};
        update['total'] = firebase.database.ServerValue.increment(1);
        update['par_jour/' + today] = firebase.database.ServerValue.increment(1);
        db.ref('qr_scans/accueil').update(update).then(redirect).catch(redirect);
        setTimeout(redirect, 3000);
    </script>
</body>
