<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Membre — USM Tennis Montargis</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- Microsoft Clarity - Analyse comportementale -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vfrevzz9j6");
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #020617;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── FOND DÉCORATIF ── */
        .bg-deco {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,215,0,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(13,27,46,0.8) 0%, transparent 70%),
                linear-gradient(175deg, #020617 0%, #0d1b2e 40%, #112240 70%, #0a1628 100%);
            z-index: 0;
            pointer-events: none;
        }
        .bg-deco::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,215,0,0.015) 60px, rgba(255,215,0,0.015) 61px),
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,215,0,0.015) 60px, rgba(255,215,0,0.015) 61px);
        }

        /* ── HEADER ── */
        .verify-header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 44px 20px 28px;
        }
        .verify-logo-wrap {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.12) 0%, rgba(255,215,0,0.03) 60%, transparent 100%);
            border: 1px solid rgba(255,215,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px rgba(255,215,0,0.2), 0 0 60px rgba(255,215,0,0.08);
            animation: halo-pulse 3s ease-in-out infinite;
        }
        @keyframes halo-pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255,215,0,0.2), 0 0 60px rgba(255,215,0,0.08); }
            50%       { box-shadow: 0 0 40px rgba(255,215,0,0.35), 0 0 80px rgba(255,215,0,0.15); }
        }
        .verify-logo-wrap img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.7)) drop-shadow(0 0 22px rgba(255,215,0,0.35));
        }
        .verify-club-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: rgba(255,215,0,0.7);
        }
        .verify-club-sub {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(255,215,0,0.35);
            margin-top: 3px;
        }

        /* ── CARTE DE VÉRIFICATION ── */
        .verify-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 20px 32px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.35);
            background: linear-gradient(145deg, rgba(13,27,46,0.95) 0%, rgba(17,34,64,0.95) 50%, rgba(10,22,40,0.95) 100%);
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255,215,0,0.1),
                0 20px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(255,215,0,0.05);
        }
        .verify-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.6), transparent);
        }

        /* ── LOADING ── */
        #verify-loading {
            padding: 52px 20px;
            text-align: center;
        }
        .verify-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255,215,0,0.1);
            border-top-color: rgba(255,215,0,0.7);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #verify-loading p {
            color: rgba(255,215,0,0.4);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* ── RÉSULTAT ACTIF ── */
        #verify-result { display: none; }

        .status-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }
        .status-banner.active {
            background: linear-gradient(90deg, rgba(34,197,94,0.15), rgba(34,197,94,0.08));
            border-bottom: 1px solid rgba(34,197,94,0.3);
            color: #4ade80;
        }
        .status-banner.inactive {
            background: linear-gradient(90deg, rgba(239,68,68,0.15), rgba(239,68,68,0.08));
            border-bottom: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.active  { background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: dot-pulse 2s ease-in-out infinite; }
        .status-dot.inactive{ background: #f87171; }
        @keyframes dot-pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #4ade80; }
            50%       { opacity: 0.6; box-shadow: 0 0 16px #4ade80; }
        }

        .member-block {
            padding: 24px 28px 20px;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .member-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .member-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .mbadge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .mbadge-gold   { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.35); color: #ffd700; }
        .mbadge-silver { background: rgba(148,163,184,0.1); border: 1px solid rgba(148,163,184,0.25); color: #94a3b8; }
        .mbadge-season { background: rgba(255,215,0,0.06); border: 1px solid rgba(255,215,0,0.2); color: rgba(255,215,0,0.6); }

        /* ── OFFRES PARTENAIRES ── */
        .offers-block {
            padding: 20px 28px 24px;
        }
        .offers-title {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(255,215,0,0.45);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .offers-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,215,0,0.1);
        }
        .offer-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .offer-item:last-child { border-bottom: none; }
        .offer-logo {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,215,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffd700;
        }
        .offer-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        .offer-name  { font-size: 0.8rem; font-weight: 600; color: #ffd700; margin-bottom: 3px; }
        .offer-desc  { font-size: 0.75rem; color: rgba(255,255,255,0.65); line-height: 1.45; }
        .offer-no-avantage { font-size: 0.75rem; color: rgba(255,255,255,0.3); font-style: italic; }

        /* ── ÉTAT ERREUR ── */
        #verify-error { display: none; padding: 48px 24px; text-align: center; }
        .error-icon { font-size: 2.5rem; color: rgba(239,68,68,0.6); margin-bottom: 16px; }
        .error-title { font-size: 1rem; font-weight: 600; color: #f87171; margin-bottom: 8px; }
        .error-sub   { font-size: 0.8rem; color: rgba(255,255,255,0.35); }

        /* ── FOOTER ── */
        .verify-footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-bottom: 36px;
            font-size: 0.7rem;
            color: rgba(255,215,0,0.2);
            letter-spacing: 2px;
        }

        /* ── TIMESTAMP ── */
        .scan-time {
            padding: 12px 28px;
            border-top: 1px solid rgba(255,215,0,0.08);
            font-size: 0.68rem;
            color: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 480px) {
            .verify-header { padding: 32px 16px 20px; }
            .member-block, .offers-block { padding-left: 20px; padding-right: 20px; }
            .member-name { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-deco"></div>

    <!-- Header club -->
    <div class="verify-header">
        <div class="verify-logo-wrap">
            <img src="/logo_usm_new.png" alt="USM Tennis Montargis">
        </div>
        <div class="verify-club-name">USM TENNIS MONTARGIS</div>
        <div class="verify-club-sub">VÉRIFICATION MEMBRE</div>
    </div>

    <!-- Carte principale -->
    <div class="verify-card">

        <!-- Chargement -->
        <div id="verify-loading">
            <div class="verify-spinner"></div>
            <p>Vérification en cours...</p>
        </div>

        <!-- Résultat -->
        <div id="verify-result">
            <div class="status-banner" id="status-banner">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text"></span>
            </div>

            <div class="member-block">
                <div class="member-name" id="member-name"></div>
                <div class="member-badges" id="member-badges"></div>
            </div>

            <div class="offers-block" id="offers-block" style="display:none;">
                <div class="offers-title"><i class="fas fa-handshake" style="color:rgba(255,215,0,0.5);"></i> OFFRES PARTENAIRES</div>
                <div id="offers-list"></div>
            </div>

            <div class="scan-time">
                <i class="fas fa-clock"></i>
                <span id="scan-time-text"></span>
            </div>
        </div>

        <!-- Erreur -->
        <div id="verify-error">
            <div class="error-icon"><i class="fas fa-user-slash"></i></div>
            <div class="error-title">Membre introuvable</div>
            <div class="error-sub">Ce QR code n'est pas associé à un membre actif.</div>
        </div>

    </div>

    <div class="verify-footer">tennismontargis.fr</div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyA4GdfEh3M6mEszwRFif049qsmoLq4tn7c",
            authDomain: "usm-tennis.firebaseapp.com",
            databaseURL: "https://usm-tennis-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "usm-tennis",
            storageBucket: "usm-tennis.firebasestorage.app",
            messagingSenderId: "631286589550",
            appId: "1:631286589550:web:7e68afcddfbb8e16d79e7f"
        });
        const db = firebase.database();

        // Extraire l'UID depuis l'URL : /v/UID
        const uid = window.location.pathname.replace(/^\/v\/?/, '').split('/')[0];

        function showError() {
            document.getElementById('verify-loading').style.display = 'none';
            document.getElementById('verify-error').style.display = 'block';
        }

        function showResult(member, sponsors) {
            document.getElementById('verify-loading').style.display = 'none';
            document.getElementById('verify-result').style.display = 'block';

            const actif = member.actif === true;
            const annee = new Date().getFullYear();

            // Bannière statut
            const banner = document.getElementById('status-banner');
            const dot    = document.getElementById('status-dot');
            const txt    = document.getElementById('status-text');
            if (actif) {
                banner.classList.add('active');
                dot.classList.add('active');
                txt.textContent = `MEMBRE ACTIF — SAISON ${annee}`;
            } else {
                banner.classList.add('inactive');
                dot.classList.add('inactive');
                txt.textContent = 'MEMBRE INACTIF';
            }

            // Nom
            const prenom = member.prenom || '';
            const nom    = member.nom    || '';
            document.getElementById('member-name').textContent = `${prenom} ${nom}`.toUpperCase();

            // Badges
            const badgesEl = document.getElementById('member-badges');
            const badges = [];
            if (member.licence)    badges.push(`<span class="mbadge mbadge-gold"><i class="fas fa-id-card"></i> ${esc(member.licence)}</span>`);
            if (member.classement) badges.push(`<span class="mbadge mbadge-silver"><i class="fas fa-trophy"></i> ${esc(member.classement)}</span>`);
            if (member.categorie)  badges.push(`<span class="mbadge mbadge-silver"><i class="fas fa-layer-group"></i> ${esc(member.categorie)}</span>`);
            badges.push(`<span class="mbadge mbadge-season"><i class="fas fa-calendar"></i> ${annee}</span>`);
            badgesEl.innerHTML = badges.join('');

            // Offres partenaires (uniquement si membre actif)
            if (actif && sponsors && sponsors.length > 0) {
                const offersBlock = document.getElementById('offers-block');
                const offersList  = document.getElementById('offers-list');
                offersBlock.style.display = 'block';
                offersList.innerHTML = sponsors
                    .filter(s => s && s.title && !s.draft)
                    .map(s => {
                        const logoHtml = (s.images && s.images[0])
                            ? `<img src="${esc(s.images[0])}" alt="${esc(s.title)}">`
                            : esc((s.title || '?').charAt(0).toUpperCase());
                        const avantageHtml = s.avantage
                            ? `<div class="offer-desc"><i class="fas fa-gift" style="color:rgba(255,215,0,0.5);margin-right:5px;font-size:0.7rem;"></i>${esc(s.avantage)}</div>`
                            : `<div class="offer-no-avantage">Avantage à venir</div>`;
                        return `
                        <div class="offer-item">
                            <div class="offer-logo">${logoHtml}</div>
                            <div>
                                <div class="offer-name">${esc(s.title)}</div>
                                ${avantageHtml}
                            </div>
                        </div>`;
                    }).join('');
            }

            // Heure du scan
            const now = new Date();
            const timeStr = now.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
                          + ' à ' + now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
            document.getElementById('scan-time-text').textContent = `Vérifié le ${timeStr}`;

            // Logger le scan (compteur anonyme pour stats ROI)
            if (uid) {
                db.ref(`scans/${uid}`).push({ t: Date.now() });
            }
        }

        function esc(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str));
            return d.innerHTML;
        }

        if (!uid) {
            showError();
        } else {
            // Lire les champs publics individuellement (règles DB : lecture par champ sans auth)
            // + sponsors en parallèle
            Promise.all([
                db.ref('members/' + uid + '/prenom').once('value'),
                db.ref('members/' + uid + '/nom').once('value'),
                db.ref('members/' + uid + '/actif').once('value'),
                db.ref('members/' + uid + '/classement').once('value'),
                db.ref('members/' + uid + '/categorie').once('value'),
                db.ref('members/' + uid + '/licence').once('value'),
                db.ref('sponsors').once('value')
            ]).then(([prenomSnap, nomSnap, actifSnap, classementSnap, categorieSnap, licenceSnap, sponsorsSnap]) => {
                // Si prenom et nom sont null → UID inconnu
                if (prenomSnap.val() === null && nomSnap.val() === null) { showError(); return; }
                const member = {
                    prenom:     prenomSnap.val(),
                    nom:        nomSnap.val(),
                    actif:      actifSnap.val() === true,
                    classement: classementSnap.val(),
                    categorie:  categorieSnap.val(),
                    licence:    licenceSnap.val()
                };
                if (!member.actif && !member.prenom) { showError(); return; }

                const sponsorsData = sponsorsSnap.val();
                const sponsors = sponsorsData
                    ? (Array.isArray(sponsorsData) ? sponsorsData : Object.values(sponsorsData))
                    : [];

                showResult(member, sponsors);
            }).catch(() => showError());
        }
    </script>
</body>
</html>
