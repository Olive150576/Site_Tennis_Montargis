<html lang="fr">
<head>

<meta name="robots" content="noindex, nofollow">

<style>
/* Même charte que le site (assets/css/site.css) : bleu royal, lignes de court, jaune balle, tableau de score vert. */
:root{
  --bg:#f3f5fa;--bg-2:#e9edf6;--surface:#fff;--ink:#0b1640;--ink-2:#47527a;--ink-3:#6f7897;
  --line:#d9dfec;--blue:#1541c9;--court-a:#1541c9;--court-b:#0c2a8a;--court-c:#081d63;
  --court-line:rgba(255,255,255,.22);--ball:#dcf23f;--ball-ink:#0b1640;--board:#0f3d2f;--board-ink:#f2efe0;
  --ok-dot:#7dffb0;--err:#c43a31;--err-soft:#fbe6e4;--shadow:0 10px 40px rgba(11,22,64,.14);
  --font-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060b1d;--bg-2:#0a1128;--surface:#0d1633;--ink:#e8edf8;--ink-2:#a4afcc;--ink-3:#7e89aa;
  --line:#1c2750;--blue:#5b85ff;--court-a:#1b3db5;--court-b:#0e2376;--court-c:#0a1752;
  --court-line:rgba(255,255,255,.16);--ball:#e3ff3d;--board:#0b3025;--err:#ff7a70;--err-soft:#3a1514;
  --shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#060b1d;--bg-2:#0a1128;--surface:#0d1633;--ink:#e8edf8;--ink-2:#a4afcc;--ink-3:#7e89aa;
  --line:#1c2750;--blue:#5b85ff;--court-a:#1b3db5;--court-b:#0e2376;--court-c:#0a1752;
  --court-line:rgba(255,255,255,.16);--ball:#e3ff3d;--board:#0b3025;--err:#ff7a70;--err-soft:#3a1514;
  --shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 24px;-webkit-font-smoothing:antialiased}

.card{width:100%;max-width:440px;margin:20px auto 0;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}

.court{position:relative;padding:26px 20px 22px;text-align:center;color:#fff;
  background:linear-gradient(160deg,var(--court-a),var(--court-b) 60%,var(--court-c));isolation:isolate}
.court::before{content:"";position:absolute;inset:12px;border:2px solid var(--court-line);border-radius:6px;z-index:-1}
.court::after{content:"";position:absolute;left:50%;top:12px;bottom:12px;border-left:2px solid var(--court-line);z-index:-1}
.court img{width:84px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.court b{display:block;font-family:var(--font-display);font-stretch:115%;font-weight:800;font-size:1.05rem;
  letter-spacing:.04em;text-transform:uppercase}
.court span{display:block;margin-top:4px;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.78)}

#verify-loading{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:.9rem}
.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;
  animation:spin .9s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

#verify-result{display:none}
.status{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px;font-family:var(--font-display);
  font-stretch:110%;font-weight:700;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase}
.status.active{background:var(--board);color:var(--board-ink)}
.status.inactive{background:var(--err-soft);color:var(--err)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.status.active .dot{background:var(--ok-dot);box-shadow:0 0 0 4px rgba(125,255,176,.2)}
.status.inactive .dot{background:var(--err)}

.member{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.member-name{font-family:var(--font-display);font-stretch:115%;font-weight:800;font-size:1.5rem;line-height:1.1;
  letter-spacing:.01em;text-transform:uppercase;margin-bottom:12px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:600;
  background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.lic{background:var(--ball);color:var(--ball-ink);border-color:var(--ball);font-weight:700}
.badge svg{width:14px;height:14px;flex:none}

.offers{padding:20px 22px 8px}
.offers h2{font-family:var(--font-display);font-stretch:110%;font-weight:800;font-size:.78rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.offers h2::after{content:"";flex:1;height:1px;background:var(--line)}
.offer{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.offer:last-child{border-bottom:0}
.logo{width:52px;height:52px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;flex:none;overflow:hidden;font-family:var(--font-display);font-weight:800;color:var(--blue);font-size:1.2rem}
.logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.offer-name{font-weight:700;font-size:.98rem;color:var(--ink)}
.offer-desc{font-size:.86rem;color:var(--ink-2);margin-top:2px}
.offer-desc svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px;color:var(--blue)}
.offer-none{font-size:.84rem;color:var(--ink-3);font-style:italic;margin-top:2px}

.scan{padding:12px 22px 16px;font-size:.76rem;color:var(--ink-3)}

#verify-error{display:none;padding:44px 24px;text-align:center}
.err-ico{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;background:var(--err-soft);color:var(--err);
  display:flex;align-items:center;justify-content:center}
.err-ico svg{width:26px;height:26px}
.err-title{font-family:var(--font-display);font-stretch:110%;font-weight:800;font-size:1.15rem;margin-bottom:6px}
.err-sub{font-size:.9rem;color:var(--ink-2)}

.foot{margin-top:18px;font-size:.78rem;color:var(--ink-3);text-align:center}
.foot a{color:var(--blue);text-decoration:none;font-weight:600}
@media (max-width:360px){.member-name{font-size:1.25rem}}
</style>
</head>
<body>
<main class="card">
  <header class="court">
    <img src="/assets/img/brand/logo-usm.webp" alt="USM Tennis Montargis" width="84" height="64">
    <b>USM Tennis Montargis</b>
    <span>Vérification membre</span>
  </header>

  <div id="verify-loading" role="status"><div class="spinner"></div>Vérification en cours…</div>

  <div id="verify-result">
    <div class="status" id="status-banner"><span class="dot"></span><span id="status-text"></span></div>
    <div class="member">
      <div class="member-name" id="member-name"></div>
      <div class="badges" id="member-badges"></div>
    </div>
    <section class="offers" id="offers-block" style="display:none">
      <h2>Offres partenaires</h2>
      <div id="offers-list"></div>
    </section>
    <div class="scan" id="scan-time-text"></div>
  </div>

  <div id="verify-error" role="alert">
    <div class="err-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
    <div class="err-title">Membre introuvable</div>
    <div class="err-sub">Ce QR code n'est pas associé à un membre actif.</div>
  </div>
</main>
<p class="foot"><a href="/">tennismontargis.fr</a></p>

<!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyA4GdfEh3M6mEszwRFif049qsmoLq4tn7c",
            authDomain: "usm-tennis.firebaseapp.com",
            databaseURL: "https://usm-tennis-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "usm-tennis",
            storageBucket: "usm-tennis.firebasestorage.app",
            messagingSenderId: "631286589550",
            appId: "1:631286589550:web:7e68afcddfbb8e16d79e7f"
        });
        const db = firebase.database();

        // Extraire l'UID depuis l'URL : /v/UID
        const uid = window.location.pathname.replace(/^\/v\/?/, '').split('/')[0];

        function showError() {
            document.getElementById('verify-loading').style.display = 'none';
            document.getElementById('verify-error').style.display = 'block';
        }

        function showResult(member, sponsors) {
            document.getElementById('verify-loading').style.display = 'none';
            document.getElementById('verify-result').style.display = 'block';

            const actif = member.actif === true;
            const annee = new Date().getFullYear();

            // Bannière statut
            const banner = document.getElementById('status-banner');
            const txt    = document.getElementById('status-text');
            if (actif) {
                banner.classList.add('active');
                txt.textContent = `Membre actif · saison ${annee}`;
            } else {
                banner.classList.add('inactive');
                txt.textContent = 'Membre inactif';
            }

            // Nom
            const prenom = member.prenom || '';
            const nom    = member.nom    || '';
            document.getElementById('member-name').textContent = `${prenom} ${nom}`.toUpperCase();

            // Badges
            const badgesEl = document.getElementById('member-badges');
            const badges = [];
            if (member.licence)    badges.push(`<span class="badge lic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6.5 16c.6-1.3 1.5-2 2.5-2s1.9.7 2.5 2"/></svg> ${esc(member.licence)}</span>`);
            if (member.classement) badges.push(`<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg> ${esc(member.classement)}</span>`);
            if (member.categorie)  badges.push(`<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg> ${esc(member.categorie)}</span>`);
            badges.push(`<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg> ${annee}</span>`);
            badgesEl.innerHTML = badges.join('');

            // Offres partenaires (uniquement si membre actif)
            if (actif && sponsors && sponsors.length > 0) {
                const offersBlock = document.getElementById('offers-block');
                const offersList  = document.getElementById('offers-list');
                offersBlock.style.display = 'block';
                offersList.innerHTML = sponsors
                    .filter(s => s && s.title && !s.draft)
                    .map(s => {
                        const logoHtml = (s.images && s.images[0])
                            ? `<img src="${esc(s.images[0])}" alt="${esc(s.title)}">`
                            : esc((s.title || '?').charAt(0).toUpperCase());
                        const avantageHtml = s.avantage
                            ? `<div class="offer-desc">${GIFT}${esc(s.avantage)}</div>`
                            : `<div class="offer-none">Avantage à venir</div>`;
                        return `
                        <div class="offer">
                            <div class="logo">${logoHtml}</div>
                            <div>
                                <div class="offer-name">${esc(s.title)}</div>
                                ${avantageHtml}
                            </div>
                        </div>`;
                    }).join('');
            }

            // Heure du scan
            const now = new Date();
            const timeStr = now.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
                          + ' à ' + now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
            document.getElementById('scan-time-text').textContent = `Vérifié le ${timeStr}`;

            // Logger le scan (compteur anonyme pour stats ROI)
            if (uid) {
                db.ref(`scans/${uid}`).push({ t: Date.now() });
            }
        }

        const GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8h14v-8M12 8c-2-3-5-3-5-1s3 1 5 1zM12 8c2-3 5-3 5-1s-3 1-5 1z"/></svg>';

        function esc(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str));
            return d.innerHTML;
        }

        if (!uid) {
            showError();
        } else {
            // Lire les champs publics individuellement (règles DB : lecture par champ sans auth)
            // + sponsors en parallèle
            Promise.all([
                db.ref('members/' + uid + '/prenom').once('value'),
                db.ref('members/' + uid + '/nom').once('value'),
                db.ref('members/' + uid + '/actif').once('value'),
                db.ref('members/' + uid + '/classement').once('value'),
                db.ref('members/' + uid + '/categorie').once('value'),
                db.ref('members/' + uid + '/licence').once('value'),
                db.ref('sponsors').once('value'),
                // Nouveau site : partenaires gérés dans site_v2 (ignoré si absent ou illisible)
                db.ref('site_v2/sponsors').once('value').catch(() => null)
            ]).then(([prenomSnap, nomSnap, actifSnap, classementSnap, categorieSnap, licenceSnap, sponsorsSnap, v2Snap]) => {
                // Si prenom et nom sont null → UID inconnu
                if (prenomSnap.val() === null && nomSnap.val() === null) { showError(); return; }
                const member = {
                    prenom:     prenomSnap.val(),
                    nom:        nomSnap.val(),
                    actif:      actifSnap.val() === true,
                    classement: classementSnap.val(),
                    categorie:  categorieSnap.val(),
                    licence:    licenceSnap.val()
                };
                if (!member.actif && !member.prenom) { showError(); return; }

                const sponsorsData = sponsorsSnap.val();
                let sponsors = sponsorsData
                    ? (Array.isArray(sponsorsData) ? sponsorsData : Object.values(sponsorsData))
                    : [];
                const v2 = v2Snap && v2Snap.val();
                if (v2) {
                    const today = new Date().toISOString().slice(0, 10);
                    const isOffer = (p) => p.perk && !/à venir|bientôt/i.test(p.perk) && (!p.perkUntil || p.perkUntil >= today);
                    const abs = (u) => (/^https?:/.test(u) ? u : '/' + String(u).replace(/^\/+/, ''));
                    sponsors = (Array.isArray(v2) ? v2 : Object.values(v2))
                        .filter((p) => p && p.name && !p.draft && !/^USM\b/.test(p.name))
                        .sort((a, b) => (a.order || 0) - (b.order || 0))
                        .map((p) => ({ title: p.name, images: p.logo && p.logo.src ? [abs(p.logo.sm || p.logo.src)] : [], avantage: isOffer(p) ? p.perk : null }));
                }

                showResult(member, sponsors);
            }).catch(() => showError());
        }
    </script>
</body>
</html>
